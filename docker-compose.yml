services:
    airflow-db:
        image: postgres:16
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: airflow
            POSTGRES_DB: airflow
        volumes:
            - airflow_db:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U airflow -d airflow'
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    analytics-db:
        image: postgres:16
        environment:
            POSTGRES_USER: analytics
            POSTGRES_PASSWORD: analytics
            POSTGRES_DB: analytics
        ports:
            - '5433:5432'
        volumes:
            - analytics_db:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U analytics -d analytics'
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    airflow-init:
        build:
            context: .
            dockerfile: Dockerfile.airflow
        depends_on:
            airflow-db:
                condition: service_healthy
            analytics-db:
                condition: service_healthy
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
            AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
            _AIRFLOW_WWW_USER_USERNAME: airflow
            _AIRFLOW_WWW_USER_PASSWORD: airflow
        user: '${AIRFLOW_UID}:0'
        volumes:
            - ./dags:/opt/airflow/dags
            - ./dbt:/opt/dbt
        command:
            [
                'bash',
                '-lc',
                'airflow db migrate && airflow users create --role Admin --username $${_AIRFLOW_WWW_USER_USERNAME} --password $${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --email admin@example.com || true'
            ]

    airflow-webserver:
        build:
            context: .
            dockerfile: Dockerfile.airflow
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
            AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
            AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

            DBT_PROFILES_DIR: /opt/dbt
        ports:
            - '8080:8080'
        user: '${AIRFLOW_UID}:0'
        volumes:
            - ./dags:/opt/airflow/dags
            - ./dbt:/opt/dbt
        command:
            [
                'bash',
                '-lc',
                'airflow webserver'
            ]

    airflow-scheduler:
        build:
            context: .
            dockerfile: Dockerfile.airflow
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
            AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
            DBT_PROFILES_DIR: /opt/dbt
        user: '${AIRFLOW_UID}:0'
        volumes:
            - ./dags:/opt/airflow/dags
            - ./dbt:/opt/dbt
        command:
            [
                'bash',
                '-lc',
                'airflow scheduler'
            ]

    airflow-triggerer:
        build:
            context: .
            dockerfile: Dockerfile.airflow
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
            AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
            DBT_PROFILES_DIR: /opt/dbt
        user: '${AIRFLOW_UID}:0'
        volumes:
            - ./dags:/opt/airflow/dags
            - ./dbt:/opt/dbt
        command:
            [
                'bash',
                '-lc',
                'airflow triggerer'
            ]

volumes:
    airflow_db:
    analytics_db:
